version: '3.8'

services:
  database:
    image: ://microsoft.com
    container_name: asset-management-mssql
    environment:
      - ACCEPT_EULA=Y
      # Fiksuus/Turvallisuus: Luetaan salasana tietokoneen omasta ympäristömuuttujasta
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
